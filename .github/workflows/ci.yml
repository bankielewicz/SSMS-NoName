name: CI

# Tests and measures the parts of NoName that can run outside SSMS: the NoName.Diagnostics.Core
# library. The VSIX runs only inside SSMS 22 and is checked by the diagnostic run instead
# (docs/specs/noname/feasibility-spike.md).
#
# Pushes to main set the coverage baseline; pull requests are compared against it by the
# repository's code-coverage rule (95% line coverage minimum).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      code-quality: write # upload coverage for the code-coverage rule
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Coverage line numbers must match the pull request's files, not GitHub's merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Test NoName.Diagnostics.Core with coverage
        run: >-
          dotnet test tests/NoName.Diagnostics.Core.Tests/NoName.Diagnostics.Core.Tests.csproj
          --settings tests/coverage.runsettings
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Check line coverage (95% minimum)
        id: coverage
        run: python3 scripts/coverage_gate.py TestResults coverage.cobertura.xml --minimum 95

      - name: Upload coverage to GitHub
        # Upload even when the check above fails, so the pull request shows what's missing.
        if: ${{ !cancelled() && steps.coverage.outputs.report != '' }}
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: ${{ steps.coverage.outputs.report }}
          language: C#
          label: code-coverage/core
